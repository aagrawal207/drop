name: FallingBall
options:
  bundleIdPrefix: com.agraabhi
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    MARKETING_VERSION: "1.2"
    CURRENT_PROJECT_VERSION: "5"
    GENERATE_INFOPLIST_FILE: YES
    ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    INFOPLIST_KEY_CFBundleDisplayName: Drop
    INFOPLIST_KEY_UIApplicationSceneManifest_Generation: NO
    INFOPLIST_KEY_UILaunchScreen_Generation: YES
    # iPhone is portrait-only by design. iPad multitasking requires all four, so the
    # scene letterboxes a fixed portrait field there (see GameViewController).
    INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: UIInterfaceOrientationPortrait
    INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight
    INFOPLIST_KEY_UIStatusBarHidden: YES
    # App uses only standard HTTPS/OS crypto — declare exempt so every upload
    # skips the export-compliance questionnaire.
    INFOPLIST_KEY_ITSAppUsesNonExemptEncryption: NO
    # The ball is steered by device tilt (CMMotionManager accelerometer).
    INFOPLIST_KEY_NSMotionUsageDescription: "Drop uses motion to let you steer the ball by tilting your device."
    CODE_SIGN_STYLE: Automatic
    DEVELOPMENT_TEAM: W2NS9DM63G
targets:
  FallingBall:
    type: application
    platform: iOS
    sources:
      - Sources
    info:
      path: build/FallingBall-Info.plist
      properties:
        UIApplicationSceneManifest:
          # One game window: settings, scores and tips are app-wide singletons.
          UIApplicationSupportsMultipleScenes: false
          UISceneConfigurations:
            UIWindowSceneSessionRoleApplication:
              - UISceneConfigurationName: Default
                UISceneDelegateClassName: $(PRODUCT_MODULE_NAME).SceneDelegate
    settings:
      base:
        # Explicit, unique bundle ID. The old com.agraabhi.FallingBall was claimed
        # by a different (personal) team from early on-device installs and can't be
        # re-registered to the paid team, which also blocked the Game Center App ID.
        PRODUCT_BUNDLE_IDENTIFIER: com.agraabhi.drop
        # iPhone and iPad. xcodegen sets the family AT THE TARGET LEVEL, so it must live
        # here; a project-level value gets overridden.
        TARGETED_DEVICE_FAMILY: "1,2"
    entitlements:
      path: FallingBall.entitlements
      properties:
        com.apple.developer.game-center: true
  # Screenshot/UI automation only — never shipped (test bundles aren't part of
  # the App Store archive). Drives the game on the simulator and saves
  # device-resolution PNGs for the store listing.
  FallingBallUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - UITests
      # StoreKitTest sessions load the catalog from the UI-test bundle.
      - path: TipJar.storekit
        buildPhase: resources
    dependencies:
      - target: FallingBall
schemes:
  FallingBall:
    build:
      targets:
        FallingBall: all
    run:
      config: Debug
      # Local StoreKit products so the tip jar works in a simulator without App Store
      # Connect; TestFlight and the App Store use the real products with the same IDs.
      storeKitConfiguration: TipJar.storekit
    test:
      config: Debug
      storeKitConfiguration: TipJar.storekit
      targets:
        - FallingBallUITests
    archive:
      config: Release
